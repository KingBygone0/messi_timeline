name: Add milestone from issue

# When someone files a "New Messi milestone" issue (label: new-milestone),
# parse it, append the event to js/data.js, commit, and close the issue.
# No API key, no cost — runs free on public-repo Actions.
on:
  issues:
    types: [opened, edited]

permissions:
  contents: write   # commit + push data.js
  issues: write     # comment on / close the issue

jobs:
  add:
    if: contains(join(github.event.issue.labels.*.name, ','), 'new-milestone')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Parse issue and append milestone
        id: add
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/add-from-issue.mjs

      - name: Commit and push
        if: steps.add.outputs.status == 'added'
        env:
          NEW_ID: ${{ steps.add.outputs.id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "messi-timeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add js/data.js
          git commit -m "Add milestone $NEW_ID (issue #$ISSUE_NUMBER) [skip ci]"
          git push

      - name: Comment success and close issue
        if: steps.add.outputs.status == 'added'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_ID: ${{ steps.add.outputs.id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "✅ Added **$NEW_ID** to the timeline. It will be live on the site in about a minute."
          gh issue close "$ISSUE_NUMBER"

      - name: Comment that it needs fixing
        if: steps.add.outputs.status != 'added'
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ steps.add.outputs.message }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "⚠️ Could not add this milestone: $MSG

          Edit the issue to fix it and I'll try again automatically."

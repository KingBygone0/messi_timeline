name: Auto-update timeline

# Runs weekly to research new Messi milestones and publish them directly.
# Also runnable on demand from the Actions tab (workflow_dispatch).
on:
  schedule:
    - cron: '0 9 * * 1'   # every Monday at 09:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write          # allow the job to commit + push data.js

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Research and append new milestones
        working-directory: scripts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-sonnet-4-6
        run: node update-timeline.mjs

      - name: Commit and push if changed
        run: |
          if [ -n "$(git status --porcelain js/data.js)" ]; then
            git config user.name "messi-timeline-bot"
            git config user.email "actions@users.noreply.github.com"
            git add js/data.js
            git commit -m "Auto-update: new Messi milestone(s) [skip ci]"
            git push
          else
            echo "No new milestones — nothing to commit."
          fi

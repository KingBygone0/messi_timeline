<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Messi Timeline</title>

    <!-- SEO / social -->
    <meta name="description" content="Lionel Messi's career from his 2004 La Liga debut to the 2022 World Cup triumph and beyond — 23 milestones, each with YouTube highlights and X posts." />
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="The Messi Timeline" />
    <meta property="og:description" content="Lionel Messi's career from his 2004 La Liga debut to the 2022 World Cup triumph and beyond — 23 milestones, each with YouTube highlights and X posts." />
    <meta name="twitter:card"        content="summary" />
    <meta name="twitter:title"       content="The Messi Timeline" />
    <meta name="twitter:description" content="Lionel Messi's career from his 2004 La Liga debut to the 2022 World Cup triumph and beyond — 23 milestones, each with YouTube highlights and X posts." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:ital,opsz@1,9..144&family=Hanken+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <a href="#timeline" class="skip-link">Skip to timeline</a>

    <header class="hero" role="banner">
      <h1 class="hero__name">MESSI</h1>
      <p class="hero__subtitle">The Greatest Career in Football</p>
      <ul class="hero__stats" aria-label="Career statistics">
        <li>8 Ballon d'Ors</li>
        <li>1 World Cup</li>
        <li>1 Copa América</li>
        <li>800+ Career Goals</li>
      </ul>
    </header>

    <nav class="era-filter" aria-label="Filter by era">
      <button class="era-filter__btn active" data-era="all"       aria-pressed="true" >All</button>
      <button class="era-filter__btn"        data-era="barca"     aria-pressed="false">Barcelona</button>
      <button class="era-filter__btn"        data-era="psg"       aria-pressed="false">PSG</button>
      <button class="era-filter__btn"        data-era="miami"     aria-pressed="false">Inter Miami</button>
      <button class="era-filter__btn"        data-era="argentina" aria-pressed="false">Argentina</button>
    </nav>

    <main class="timeline" id="timeline" role="main">
      <!-- Cards injected by app.js -->
    </main>

    <!-- Back-to-top -->
    <button
      class="back-to-top"
      aria-label="Scroll back to top"
      aria-hidden="true"
      tabindex="-1"
    >&#8593;</button>

    <!-- Media modal — YouTube or X embed -->
    <div
      class="modal"
      id="media-modal"
      role="dialog"
      aria-modal="true"
      aria-label="Media viewer"
      hidden
    >
      <div class="modal__backdrop"></div>
      <div class="modal__content">
        <button class="modal__close" aria-label="Close">&times;</button>

        <!-- YouTube panel -->
        <div class="modal__yt-wrap" id="modal-yt" hidden>
          <iframe
            id="yt-iframe"
            src=""
            title="YouTube video"
            frameborder="0"
            allow="autoplay; encrypted-media"
            allowfullscreen
          ></iframe>
        </div>

        <!-- X / Twitter panel -->
        <div class="modal__tweet-wrap" id="modal-tweet" hidden></div>
      </div>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>

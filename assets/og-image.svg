<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="48%" r="55%">
      <stop offset="0%"   stop-color="#a50044" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0f"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Era colour bar -->
  <rect x="0"   y="610" width="300" height="6" fill="#a50044"/>
  <rect x="300" y="610" width="300" height="6" fill="#1e4fc4"/>
  <rect x="600" y="610" width="300" height="6" fill="#ff5ca8"/>
  <rect x="900" y="610" width="300" height="6" fill="#6cace4"/>

  <!-- Headline -->
  <text x="600" y="355"
        text-anchor="middle"
        font-family="'Arial Black','Impact',sans-serif"
        font-weight="900"
        font-size="215"
        letter-spacing="14"
        fill="#f4f4f0">MESSI</text>

  <!-- Subtitle -->
  <text x="600" y="420"
        text-anchor="middle"
        font-family="Georgia,'Times New Roman',serif"
        font-style="italic"
        font-size="26"
        letter-spacing="1"
        fill="#909098">The Greatest Career in Football</text>

  <!-- Stat strip -->
  <text x="600" y="480"
        text-anchor="middle"
        font-family="Arial,sans-serif"
        font-weight="700"
        font-size="14"
        letter-spacing="4"
        fill="#6b6b7a">8 BALLON D'ORS  ·  1 WORLD CUP  ·  2 COPA AMERICAS  ·  800+ GOALS</text>
</svg>
